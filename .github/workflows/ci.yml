name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (node24)
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-dev.lock
      - name: Run backend tests and coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - name: Lint backend
        run: ruff check app tests ../scripts
      - name: Check backend formatting
        run: ruff format --check app tests ../scripts
      - name: Type-check backend
        run: mypy app
      - name: Check Python syntax
        run: python -m compileall -q app tests ../scripts
      - name: Scan tracked files for secrets
        run: python ../scripts/secret_scan.py

  frontend:
    name: Frontend / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Verify npm registry signatures
        run: npm audit signatures
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Check build did not alter the repository
        run: |
          git diff --check
          status="$(git status --porcelain -uall)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "Build produced tracked changes or untracked artifacts."
            exit 1
          fi
